<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PricingAI</title>

    <!-- Dashboard CSS Link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 900px;
            margin: 20px;
            background: #162436;
            border-radius: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        /* Left Branding Panel */
        .brand-panel {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: bold;
            color: #00d2ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feature-list {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .feature-item i {
            color: #00ff88;
            font-size: 16px;
            background: rgba(0, 255, 136, 0.1);
            padding: 8px;
            border-radius: 50%;
        }

        /* Right Form Panel */
        .form-panel {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header h2 {
            margin: 0 0 6px 0;
            color: #fff;
            font-size: 24px;
        }

        .form-header p {
            margin: 0 0 25px 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: #23354d;
            border: 1px solid #34495e;
            border-radius: 8px;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.25);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 36px;
            color: #64748b;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #00d2ff;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #38bdf8;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .back-home:hover {
            color: #00d2ff;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }
            .brand-panel {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <!-- Left Column: Branding Showcase -->
        <div class="brand-panel">
            <div>
                <a href="/" class="brand-logo">
                    🤖 PricingAI
                </a>
                <p style="color: #64748b; font-size: 13px; margin-top: 8px;">Smart AI Pricing Optimization Platform</p>
            </div>

            <div class="feature-list">
                <div class="feature-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Real-time Profit & Demand Predictions</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-brain"></i>
                    <span>Machine Learning Elasticity Model</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-shield-alt"></i>
                    <span>Secure SQLite Analytics Storage</span>
                </div>
            </div>

            <div style="color: #64748b; font-size: 12px;">
                © 2026 PricingAI System
            </div>
        </div>

        <!-- Right Column: Login Form -->
        <div class="form-panel">

            <a href="/" class="back-home">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <div class="form-header">
                <h2>Welcome Back 👋</h2>
                <p>Sign in to access your dashboard</p>
            </div>

            <form action="/dashboard" method="GET">

                <div class="input-group">
                    <label>Email Address</label>
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" class="input-field" value="admin@pricingai.com" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="input-field" value="123456" placeholder="Enter password" required>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px;">
                    <label style="color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                        <input type="checkbox" checked style="accent-color: #00d2ff;"> Remember me
                    </label>
                    <a href="#" onclick="alert('Password reset link sent to registered email!')" style="color: #00d2ff; text-decoration: none;">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">
                    🔑 Sign In to Dashboard
                </button>

            </form>

            <div style="text-align: center; margin-top: 25px; font-size: 13px; color: #94a3b8;">
                Don't have an account? 
                <a href="/register" style="color: #00ff88; text-decoration: none; font-weight: bold;">Create Account</a>
            </div>

        </div>

    </div>

</body>

</html>
